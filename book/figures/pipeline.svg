<text x="592.5" y="152" font-size="12.5" text-anchor="middle" fill="#1a1a1a">score</text>
<text x="592.5" y="172" font-size="10.5" text-anchor="middle" fill="#1a1a1a" font-style="italic">and a win</text>
<text x="592.5" y="185" font-size="10.5" text-anchor="middle" fill="#1a1a1a" font-style="italic">chance</text>
<text x="630" y="94" font-size="9.5" text-anchor="end" fill="#6b6b6b">ch. 7–8</text>
