<text x="512" y="224" font-size="9.5" text-anchor="end" fill="#6b6b6b">ch. 7</text>
<rect x="555" y="100" width="75" height="104" rx="0" fill="#d9d6ca" stroke="#1a1a1a" stroke-width="1.0"/>
