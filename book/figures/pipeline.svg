<text x="280" y="123" font-size="12.5" text-anchor="middle" fill="#1a1a1a">box-score prior</text>
<text x="280" y="138" font-size="10" text-anchor="middle" fill="#6b6b6b" font-style="italic">a rating from stats</text>
