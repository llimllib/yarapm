<svg viewBox="0 0 640 320" width="100%" role="img" aria-label="Diagram of the model: segments and box scores feed player ratings, which with minutes and tempo give each team's expected score" xmlns="http://www.w3.org/2000/svg">
<defs>
<pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
<rect width="6" height="6" fill="#fbfaf5"/><line x1="0" y1="0" x2="0" y2="6" stroke="#1a1a1a" stroke-width="1.4"/></pattern>
<pattern id="dots" width="5" height="5" patternUnits="userSpaceOnUse">
<rect width="5" height="5" fill="#fbfaf5"/><circle cx="2.5" cy="2.5" r=".9" fill="#1a1a1a"/></pattern>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M 0 1 L 9 5 L 0 9 z" fill="#1a1a1a"/></marker>
</defs>
<text x="20" y="18" font-size="10.5" text-anchor="start" fill="#6b6b6b" font-style="italic">from nba_data</text>
<rect x="20" y="28" width="140" height="46" rx="0" fill="#fbfaf5" stroke="#1a1a1a" stroke-width="1.0"/>
<text x="90" y="47" font-size="12.5" text-anchor="middle" fill="#1a1a1a">play-by-play</text>
<text x="90" y="62" font-size="10" text-anchor="middle" fill="#6b6b6b" font-style="italic">who was on, what happened</text>
<rect x="20" y="104" width="140" height="46" rx="0" fill="#fbfaf5" stroke="#1a1a1a" stroke-width="1.0"/>
<text x="90" y="123" font-size="12.5" text-anchor="middle" fill="#1a1a1a">box scores</text>
<text x="90" y="138" font-size="10" text-anchor="middle" fill="#6b6b6b" font-style="italic">per player, per game</text>
<rect x="20" y="180" width="140" height="46" rx="0" fill="#fbfaf5" stroke="#1a1a1a" stroke-width="1.0"/>
<text x="90" y="199" font-size="12.5" text-anchor="middle" fill="#1a1a1a">game results</text>
<text x="90" y="214" font-size="10" text-anchor="middle" fill="#6b6b6b" font-style="italic">scores, possessions</text>
<rect x="20" y="256" width="140" height="46" rx="0" fill="#fbfaf5" stroke="#1a1a1a" stroke-width="1.0"/>
<text x="90" y="275" font-size="12.5" text-anchor="middle" fill="#1a1a1a">schedule</text>
